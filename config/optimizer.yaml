OPTIMIZER:
  ADAMW:
    lr: 3.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.01
    amsgrad: False
  SGD:
    lr: 0.1
    momentum: 0.9
    weight_decay: 1e-4

LR_SCHEDULER:
  STEP:
    step_size: 100
    gamma: 0.1
    last_epoch: -1
  COSINEANNEALINGLR:
    T_max: 300
    eta_min: 0
    last_epoch: -1 